name: CI/CD
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  latex:
    uses: ./.github/workflows/latex.yml

  build:
    runs-on: ubuntu-latest
    needs: latex
    env:
      HUGO_VERSION: 0.140.2
      DART_SASS_VERSION: 1.102.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: |
          wget -qO- https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz | sudo tar xz -C /usr/local
          echo "/usr/local/dart-sass" >> $GITHUB_PATH

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci && npm run build || true"

      - name: Restore CV from artifact
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: ./static

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment

  keepalive:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Keep schedule running
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST_MSG=$(git log -1 --format='%s')
          if [ "$LAST_MSG" = "chore: keep schedule running" ]; then
            git commit --allow-empty --amend --no-edit
            git push --force-with-lease
          else
            git commit --allow-empty -m "chore: keep schedule running"
            git push
          fi
