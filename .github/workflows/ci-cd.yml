name: CI/CD
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      recompile_cv:
        description: "Recompile CV (ignore cache)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-check.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Pages
        uses: actions/configure-pages@v6
        id: pages

      - name: Cache Check
        id: cache-check
        uses: actions/cache@v6
        with:
          lookup-only: true
          path: ./static/cv.pdf
          key: ${{ runner.os }}-CV-${{ hashFiles('**/*.tex', '**/*.cls') }}

  latex:
    needs: setup
    uses: ./.github/workflows/latex.yml
    if: ${{ needs.setup.outputs.cache-hit != 'true' || github.event_name == 'schedule' || inputs.recompile_cv == true }}

  build:
    runs-on: ubuntu-latest
    needs: latex
    if: ${{ !failure() && !cancelled() }}
    env:
      HUGO_VERSION: 0.140.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass Embedded
        run: sudo snap install dart-sass-embedded

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci && npm run build || true"

      - name: Restore CV from artifact
        id: cv-artifact
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: ./static
        continue-on-error: true

      - name: Restore CV from cache
        if: steps.cv-artifact.outcome == 'failure'
        uses: actions/cache/restore@v6
        with:
          path: ./static/cv.pdf
          key: ${{ runner.os }}-CV-${{ hashFiles('**/*.tex', '**/*.cls') }}

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment

  keepalive:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Keep schedule running
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST_MSG=$(git log -1 --format='%s')
          if [ "$LAST_MSG" = "chore: keep schedule running" ]; then
            git commit --allow-empty --amend --no-edit
            git push --force-with-lease
          else
            git commit --allow-empty -m "chore: keep schedule running"
            git push
          fi
