name: LaTeX
on:
  workflow_call:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Tectonic bundle
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-bundle

      - name: Set up tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.16.9

      - name: Compile LaTeX
        run: tectonic ./cv/cv.tex

      - name: Move PDF to Static
        run: mv ./cv/cv.pdf static/cv.pdf

      - name: Upload CV artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: ./static/cv.pdf
